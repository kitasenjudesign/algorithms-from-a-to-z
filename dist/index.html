<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <!--meta name="viewport" content="width=device-width, initial-scale=1.0"-->
    <title>Algorithms from A to Z</title>
    
    <script>
      window.isStation = false;
      window.noEntryAreaWidth = 3455;

  <style type="text/css">

    #noEntryArea{
      background-color: #00f8;
      position: absolute;
      z-index: 10003;
      display: none;
      pointer-events: none;
    }

    :root {
      --fontSizeL: 33px;
      --fontSizeLja: 30px;
      --fontSizeM: 24px;
      --fontSizeS: 18px;
      --fontSizeSja: 16px;
    }
    body{
      margin:0;
      padding:0;
      color: #fff;
      background-color: #000;
      overflow: hidden;
      font-size: var(--fontSizeL);
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    canvas{
      position: absolute;
      display: block;
    }
    #cover{
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 999;
      animation: anim 1s linear 1 forwards;
      pointer-events: none;
    }

    @keyframes anim {
      0%,10%{
        opacity: 100%;
      }
      100%{
        opacity: 0;
      }
      
    }
    #ascii{
      font-family: monospace;
      pointer-events: none;
      /*font-size: 33px;*/
    }

    #info{
      z-index: 99999;
      position: absolute;
      top: 100px;
      left: 100px;
      display: inline-block;
      background-color: #8880;
    }
    #title{
      font-size: var(--fontSizeS);
    }
    
    #subtitle{
      font-weight: bold;
    }
    #year{
      margin-top: 2px;
      display: block;
      font-size: var(--fontSizeS);
    }
    .shadow{
      text-shadow: 0px 0px 5px #000;
    }

    #center,#center2,#center3{
      width: 30px;
      height: 30px;
      border: #f00 1px solid;
      position: absolute;
      z-index: 20000;
      font-size: 8px;
      display: none;
    }

    #center2{}    
    #center3{}



    #about{
      width: 100vw;
      height: 100vh;
      position: absolute;
      z-index: 20000;
      display: none;
      /*display: flex;           左右に並べる */
    }

    .aboutCon {
      flex: 1;                /* 50% + 50% */
      height: 100%;
      display: flex;
      flex-direction: column; /* 縦に並べる */
      justify-content: center;/* 縦方向センター */
      align-items: left;    /* 横方向センター（不要なら消す） */
      box-sizing: border-box;
      background: #000;
    }

    

    .shibuya2{
      font-size: var(--fontSizeS);
      display: inline-block;
    }
    .shibuya1{
      font-size: var(--fontSizeS);
      display: inline-block;
    }
    .title2{
      font-size: var(--fontSizeLja);
      font-weight: bold;
      height: 45px;
      position: relative;
      top: -2px;

    }    

    .title1{
      font-size: var(--fontSizeL);
      font-weight: bold;
      height: 45px;
      position: relative;
      top: -1px;
    }
    
    .name2{
      font-size: var(--fontSizeSja);
      height: 30px;
      position: relative;
      top: -1px;            
    }
    .name1{
      font-size: var(--fontSizeS);
      height: 30px;
      position: relative;
      top: 0px;      
    }

    c{
      margin-right:3px;
    }
    z{
      margin-right: 3px;
      margin-left: 3px;
    }
  </style>
  </head>

  <body>
    <div id="noEntryArea"></div>

    <div id="about">

      <div class="aboutCon">
        <div id="centerCon1">
          <div class="shibuya2" id="a1">DIG SHIBUYA 2026: SCREENS CONTEXTUALIZED</div>
          <div class="title2" id="a2"><c>A</c>から<z>Z</z>までのアルゴリズム</div>
          <div class="name2" id="a3">北千住デザイン</div>
        </div>
      </div>
      <div class="aboutCon">
        <div id="centerCon2">
          <div class="shibuya1" id="b1">DIG SHIBUYA 2026: SCREENS CONTEXTUALIZED</div>
          <div class="title1" id="b2">Algorithms from A to Z</div>
          <div class="name1" id="b3">Kitasenju Design</div>
        </div>
      </div>

    </div>


    <div id="cover"></div>

    <div id="center">typ</div>
    <div id="center2"></div>
    <div id="center3">center</div>

    <div id="info">
      <div id="title" class="shadow"></div>
      <div id="subtitle" class="shadow"></div>
      <div id="year" class="shadow"></div>
    </div>

    <script src="./bundle.js"></script>
    <canvas id="webgl"></canvas>
    <div id="ascii"></div>

  </body>
</html>
